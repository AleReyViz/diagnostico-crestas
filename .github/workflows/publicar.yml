# Publica CrestaVet en https://crestavet-shilicorp.web.app cada vez que se guardan cambios en GitHub.
name: Publicar en Firebase Hosting
on:
  push:
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIAGNOSTICO_CRESTAS }}
          channelId: live
          projectId: diagnostico-crestas
